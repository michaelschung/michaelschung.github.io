<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Explanations</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f6f6f6; --bg3: #eaeaea;
    --fg: #1a1a1a; --fg2: #555; --fg3: #888;
    --accent: #0066cc; --accent2: #004999;
    --border: #ddd; --code-bg: #f4f4f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --bg2: #222; --bg3: #2a2a2a;
      --fg: #e0e0e0; --fg2: #aaa; --fg3: #777;
      --accent: #5ba3f5; --accent2: #8bc2ff;
      --border: #333; --code-bg: #252525;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.65; font-size: 15px;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  .login-box {
    text-align: center; padding: 48px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 12px;
    max-width: 400px; width: 90%;
  }
  .login-box h1 { font-size: 22px; margin-bottom: 8px; }
  .login-box p { color: var(--fg2); margin-bottom: 24px; font-size: 14px; }
  .login-box input {
    width: 100%; padding: 10px 14px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg);
    margin-bottom: 12px; text-align: center;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .login-box input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .login-box button {
    width: 100%; padding: 10px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    cursor: pointer;
  }
  .login-box button:hover { background: var(--accent2); }
  .error { color: #cc3333; font-size: 13px; margin-top: 8px; display: none; }

  /* Directory listing (shown after auth) */
  .directory {
    max-width: 700px; width: 90%; padding: 40px;
    display: none;
  }
  .directory h1 { font-size: 24px; margin-bottom: 24px; }
  .project-group { margin-bottom: 32px; }
  .project-group h2 {
    font-size: 16px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--fg3); margin-bottom: 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .project-group ul { list-style: none; }
  .project-group li { margin-bottom: 8px; }
  .project-group a {
    color: var(--accent); font-size: 15px; padding: 6px 10px;
    display: inline-block; border-radius: 4px;
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 14px;
  }
  .project-group a:hover { background: var(--bg2); text-decoration: none; }
</style>
</head>
<body>

<div class="login-box" id="login">
  <h1>Code Explanations</h1>
  <p>This section is password-protected.</p>
  <form id="login-form">
    <input type="password" id="pw" placeholder="Password" autofocus>
    <button type="submit">Unlock</button>
  </form>
  <div class="error" id="error">Incorrect password.</div>
</div>

<div class="directory" id="directory">
  <h1>Code Explanations</h1>
  <!-- DIRECTORY_CONTENT -->
  <div class="project-group">
    <h2>pinpoint</h2>
    <ul>
    <li><a href="pinpoint/instagram-authorize.html">instagram authorize</a></li>
    <li><a href="pinpoint/instagram-helper-service.html">instagram helper service</a></li>
    </ul>
  </div>
</div>

<script>
const HASH = '1550b688999ca2c1054fa61124e2b2f8a5b45d01c1e7be2141c162124baf848d';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkAuth() {
  const stored = sessionStorage.getItem('explanations_auth');
  if (stored === HASH) showDirectory();
}

function showDirectory() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('directory').style.display = 'block';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const hash = await sha256(pw);
  if (hash === HASH) {
    sessionStorage.setItem('explanations_auth', HASH);
    showDirectory();
  } else {
    document.getElementById('error').style.display = 'block';
    document.getElementById('pw').value = '';
  }
});

checkAuth();
</script>
</body>
</html>
